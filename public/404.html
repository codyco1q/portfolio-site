<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 — Lost in the Funnel | Cody</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --text: #e4e4e7;
        --muted: #71717a;
        --border: #27272a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(60% 50% at 50% 0%, rgba(113, 113, 122, 0.08), transparent),
          var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 2rem;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .code {
        font-size: clamp(4rem, 15vw, 8rem);
        font-weight: 700;
        line-height: 1;
        background: linear-gradient(180deg, #e4e4e7, #71717a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        letter-spacing: -0.05em;
      }
      h1 {
        margin: 1.5rem 0 0.5rem;
        font-size: 1.4rem;
      }
      p {
        color: var(--muted);
        font-size: 0.95rem;
        max-width: 32rem;
        margin: 0 auto 2rem;
        line-height: 1.6;
      }
      .terminal {
        display: inline-block;
        margin-bottom: 2rem;
        font-size: 0.8rem;
        color: var(--muted);
        border: 1px solid var(--border);
        background: rgba(24, 24, 27, 0.6);
        border-radius: 999px;
        padding: 0.4rem 0.9rem;
      }
      .terminal .prompt {
        color: #34d399;
      }
      a {
        display: inline-block;
        background: #e4e4e7;
        color: #09090b;
        font-weight: 500;
        font-size: 0.9rem;
        text-decoration: none;
        padding: 0.85rem 2rem;
        border-radius: 999px;
        transition: background 0.2s ease;
      }
      a:hover {
        background: #d4d4d8;
      }
      .blink {
        display: inline-block;
        width: 0.5em;
        height: 1em;
        vertical-align: text-bottom;
        background: #a1a1aa;
        animation: blink 1.1s step-end infinite;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .blink {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="terminal mono">
        <span class="prompt">~/cody</span> $ find --page
        <span class="blink" aria-hidden="true"></span>
      </div>
      <div class="code mono">404</div>
      <h1>Lost in the funnel.</h1>
      <p>
        The page you&rsquo;re looking for isn&rsquo;t part of the build — it may have been moved or
        archived. Let&rsquo;s get you back to the good stuff.
      </p>
      <a href="/">Back to the Portfolio</a>
    </main>
  </body>
</html>
